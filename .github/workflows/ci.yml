  # ==========================================
  # STAGE 2: Build & Container Vulnerability Scan
  # ==========================================
  container-security:
    name: Container Build & Trivy CVE Scan
    needs: security-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Local Image for Security Scanning
      - name: Build Backend Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./dermasense_ai/backend
          file: ./dermasense_ai/backend/Dockerfile
          load: true
          tags: dermasense-backend:scan

      # Trivy Container Vulnerability Scan
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dermasense-backend:scan'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # STAGE 3: Secure Push to Docker Hub
  # ==========================================
  docker-publish:
    name: Push Verified Image to Docker Hub
    needs: container-security
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dermasense-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Verified Image
        uses: docker/build-push-action@v5
        with:
          context: ./dermasense_ai/backend
          file: ./dermasense_ai/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
