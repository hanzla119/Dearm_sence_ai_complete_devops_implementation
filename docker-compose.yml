version: '3.8'

services:
  backend:
    build:
      context: ./dermasense_ai/backend
      dockerfile: Dockerfile
    image: dermasense-backend:latest
    container_name: dermasense-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - WORKERS=2
      - THREADS=4
      - TIMEOUT=120
    networks:
      - dermasense-net

  frontend:
    build:
      context: ./dermasense_ai/frontend
      dockerfile: Dockerfile
    image: dermasense-frontend:latest
    container_name: dermasense-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - dermasense-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: dermasense-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - dermasense-net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: dermasense-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - dermasense-net

networks:
  dermasense-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
