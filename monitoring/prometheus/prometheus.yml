global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'dermasense-ai-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']
        labels:
          app: 'dermasense-ai'
          environment: 'local-docker'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
